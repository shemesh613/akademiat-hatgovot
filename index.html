<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>אקדמיית התגובות</title>
<style>
:root{
  --bg:#f3f6fb; --card:#fff; --ink:#1f2d45; --soft:#e4ebf4; --mute:#556178;
  --teal:#2a9d8f; --teal-d:#1d776c; --teal-l:#e6f5f3; --gold:#f2c14e; --gold-d:#c99a1f;
  --blue:#6c8ebf; --warm:#f4a261; --red:#d9534f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 50% -120px,#dcebf7 0,var(--bg) 70%);color:var(--ink);font-family:"Segoe UI",Heebo,Arial,sans-serif;user-select:none}
#app{max-width:940px;margin:0 auto;padding:12px 16px 40px}
.top{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--soft);border-radius:18px;padding:6px 14px 6px 8px;box-shadow:0 3px 12px rgba(31,45,69,.05)}
.chip svg{width:46px;height:46px;background:var(--teal-l);border-radius:50%}
.chip b{font-size:17px}
.chip small{display:block;color:var(--mute);font-size:13px}
.xpbar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;width:130px;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:9px;transition:width .8s}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{background:var(--card);border:2px solid var(--soft);border-radius:14px;font-size:19px;padding:7px 13px;cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap}
.tbtn.active{border-color:var(--teal);background:var(--teal-l)}
h1{margin:6px 0 2px;font-size:34px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 16px;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:var(--card);border:2px solid var(--soft);border-radius:22px;padding:18px 10px 14px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(31,45,69,.05);font-family:inherit;color:var(--ink)}
.tile:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(31,45,69,.1);border-color:var(--teal)}
.tile .ic{font-size:50px;line-height:1.1}
.tile .nm{font-weight:700;font-size:18px;margin:8px 0 6px}
.stars{font-size:22px;letter-spacing:3px;color:#8a6508}
.stars .off{color:#9aa7b8}
.cta{display:flex;gap:12px;margin:18px 0 8px;flex-wrap:wrap}
.big{background:var(--teal-d);color:#fff;border:0;border-radius:18px;font-size:24px;font-weight:700;padding:14px 28px;cursor:pointer;box-shadow:0 5px 0 #155a52;font-family:inherit}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
.big.gold{background:var(--gold);color:#4a3a05;box-shadow:0 5px 0 var(--gold-d)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:16px;cursor:pointer;margin-top:10px;font-family:inherit}
.scene{position:relative;background:var(--card);border-radius:26px;border:2px solid var(--soft);overflow:hidden;box-shadow:0 8px 26px rgba(31,45,69,.08)}
.scene svg{display:block;width:100%;height:auto}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
#thought{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#thought span{font-size:90px;background:rgba(255,255,255,.92);border-radius:40px;padding:6px 26px;box-shadow:0 8px 30px rgba(0,0,0,.15);animation:pop .35s}
.zone{margin-top:14px;min-height:200px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{background:var(--card);border:3px solid var(--soft);border-radius:22px;min-height:150px;font-size:54px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);transition:transform .15s,border-color .2s,opacity .3s;font-family:inherit;overflow:hidden;line-height:1.1}
.opt:hover{transform:translateY(-3px);border-color:var(--teal)}
.opt small{font-size:18px;font-weight:600;display:none}
body.words .opt small{display:block}
.opt.seen{border-color:#b9c6d6;background:#f7f9fc}
.opt.nudge{animation:glow 2s 2}
.opt.wrong{opacity:.4;animation:wob .45s}
.opt.hint{animation:glow 1.1s infinite}
@keyframes wob{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(42,157,143,.25);border-color:var(--teal)}}
.say{background:var(--card);border:3px solid var(--teal);border-radius:26px;padding:18px 22px 20px;text-align:center;animation:pop .35s}
.lbl{font-size:17px;color:var(--teal-d);font-weight:700;margin-bottom:6px}
.sent{font-size:30px;font-weight:700;line-height:1.35;margin-bottom:14px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:42px;cursor:pointer;box-shadow:0 6px 0 var(--teal-d);position:relative}
.mic.on{background:var(--red);box-shadow:0 6px 0 #a63733;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.meter{position:relative;height:16px;background:var(--soft);border-radius:10px;overflow:hidden;margin:14px auto 6px;max-width:420px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ad9cf,var(--teal),var(--gold));transition:width .08s}
.meter u{position:absolute;top:0;bottom:0;inset-inline-start:18%;width:52%;border:2px dashed var(--teal-d);border-radius:10px;background:rgba(42,157,143,.14);text-decoration:none}
.mlab{font-size:14px;color:var(--teal-d);font-weight:700}
.heard{min-height:26px;color:var(--mute);font-size:18px}
.heard.ok{color:var(--teal-d);font-weight:700}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.reward{text-align:center;animation:pop .4s}
.rcard{display:inline-block;min-width:260px;max-width:430px;border-radius:24px;padding:20px 22px;background:#fff;border:5px solid #c9d3df;box-shadow:0 10px 30px rgba(31,45,69,.14);animation:flip .8s}
.rcard.rare{border-color:var(--blue);box-shadow:0 10px 30px rgba(108,142,191,.4)}
.rcard.gold{border-color:var(--gold);box-shadow:0 0 34px rgba(242,193,78,.7);background:linear-gradient(#fffdf4,#fff6d6)}
.rcard .rk{font-size:15px;font-weight:700;color:var(--mute);letter-spacing:1px}
.rcard .ri{font-size:56px}
.rcard .rs{font-size:22px;font-weight:700;line-height:1.35;margin-top:4px}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.gain{font-size:22px;font-weight:700;margin:14px 0 4px}
.unl{color:var(--gold-d);font-weight:700;font-size:20px;margin:2px 0 8px}
.modal{position:fixed;inset:0;background:rgba(31,45,69,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--bg);border-radius:26px;padding:22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;animation:pop .3s}
.mbox h2{margin:0 0 12px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;position:relative}
.sw.sel{outline:4px solid var(--teal)}
.sw.lock{opacity:.35;cursor:default}
.sw.lock::after{content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mc{background:#fff;border:4px solid #c9d3df;border-radius:18px;padding:12px;text-align:center;font-size:16px;font-weight:600}
.mc.rare{border-color:var(--blue)} .mc.gold{border-color:var(--gold);background:#fff9e1}
.mc .ri{font-size:36px}
.mc.lk{opacity:.4;border-style:dashed}
.fly{position:fixed;font-size:30px;pointer-events:none;z-index:30;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.dots{display:flex;gap:8px}
#stage.good .me{animation:cheer .9s ease-out forwards}
#stage.good .oth{animation:away 1s ease-out forwards}
#stage.bad .oth{animation:shk .5s}
@keyframes cheer{30%{transform:translateY(-22px)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}100%{transform:none}}
@keyframes away{to{transform:translateX(46px)}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dot{width:14px;height:14px;border-radius:50%;background:var(--soft)}.dot.on{background:var(--gold)}.dot.now{outline:3px solid var(--teal);outline-offset:2px}
button:focus-visible{outline:3px solid #1d776c;outline-offset:3px}
.tchr{margin-top:22px;background:var(--card);border:2px solid var(--soft);border-radius:18px;padding:12px 16px;font-size:16px}
.tchr summary{cursor:pointer;font-weight:700}.tchr ul{margin:6px 0 10px;padding-inline-start:22px}
body.calm *{animation:none!important;transition:none!important}body.calm .fly{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fly{display:none}}
@media(max-width:480px){.tbtn{padding:7px 10px}.xpbar{width:90px}.chip small{display:none}.opt{min-height:130px;font-size:34px}}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}.opt{min-height:110px;font-size:40px}.sent{font-size:23px}h1{font-size:27px}}
/* manual marking */
.mbar{background:#fff7e0;border:3px dashed var(--gold-d);border-radius:18px;padding:10px 16px;margin-bottom:14px;font-size:17px;font-weight:700;color:#6b5208;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
body.manual .tile,body.manual .case{border-style:dashed;border-color:var(--gold-d)}
.tbtn.mk.active{border-color:var(--gold-d);background:#fff7e0}
/* detective */
.detbtn{width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#2b3550,#3d4a66);color:#fff;border:0;border-radius:22px;padding:16px 20px;cursor:pointer;font-family:inherit;text-align:right;box-shadow:0 5px 0 #1d2438}
.detbtn .ic{font-size:52px}.detbtn b{font-size:22px;display:block}.detbtn small{font-size:16px;opacity:.85}
.detbtn .prog{margin-inline-start:auto;font-size:20px;font-weight:700;background:rgba(255,255,255,.15);border-radius:14px;padding:6px 12px;white-space:nowrap}
.cases{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.case{background:var(--card);border:2px solid var(--soft);border-radius:18px;padding:12px 6px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);position:relative}
.case .ic{font-size:40px}.case .nm{font-weight:700;font-size:15px;margin-top:4px}
.case.solved{background:#eef8f1;border-color:#7cc49a}
.case.solved::after{content:"✔";position:absolute;top:6px;inset-inline-start:10px;color:#2e8b57;font-size:20px;font-weight:700}
.sit{font-size:22px;font-weight:700;text-align:center;margin:12px 0 4px}
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.clue{background:#2b3550;color:#fff;border:0;border-radius:18px;min-height:110px;font-size:40px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.clue small{font-size:16px;font-weight:600;line-height:1.3;padding:0 6px}
.clue.open{background:#fff;color:var(--ink);border:3px solid var(--gold);cursor:default;animation:flip .4s}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.verdict.v3{grid-template-columns:1fr 1fr .7fr}
.clue .qq{font-size:14px;font-weight:700;color:var(--mute)}
.clue.okc{border-color:#7cc49a;background:#eef8f1}
.clue.unk{border-color:#8a96aa;background:#f1f3f7}
.clue.flag{border-color:var(--red);background:#fdeeee}
.rulebar{text-align:center;font-size:17px;font-weight:700;margin-top:12px;color:var(--ink)}
.rules{background:#fff;border:3px solid var(--soft);border-radius:20px;padding:12px 16px;margin-bottom:14px;font-size:19px;font-weight:700}
.rules div{display:flex;align-items:center;gap:10px;margin:6px 0}
.rules div span{background:#2b3550;color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.rules p{margin:10px 0 2px;font-size:17px;color:#7a2e2b}
.verdict button{font-size:24px;font-weight:700;border-radius:20px;padding:16px 10px;cursor:pointer;font-family:inherit;border:3px solid var(--soft);background:#fff;color:var(--ink)}
.verdict button span{display:block;font-size:46px}
.verdict button:disabled{opacity:.4;cursor:default}
.verdict button.wrong{animation:wob .45s;opacity:.5}
.vbox{background:#fff;border:4px solid var(--teal);border-radius:24px;padding:18px;text-align:center;margin-top:14px;animation:pop .35s}
.vbox.at{border-color:var(--warm)}
.vbox h2{margin:0 0 6px;font-size:28px}
.vbox p{font-size:19px;margin:6px 0}
.tipbox{background:var(--teal-l);border-radius:16px;padding:10px 14px;font-size:18px;font-weight:600;margin:12px auto 0;max-width:560px}
@media(max-width:620px){.cases{grid-template-columns:repeat(2,1fr)}.clues{grid-template-columns:1fr}.clue{min-height:80px;font-size:30px}.verdict button{font-size:17px;padding:12px 6px}.verdict button span{font-size:36px}.rules{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
           set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- saved progress ---------- */
var G=store.get("noamV3",{xp:0,done:{},hero:"#2a9d8f",words:true,log:[]});
if(!G||typeof G!=="object") G={xp:0,done:{},hero:"#2a9d8f",words:true,log:[]};
G.done=(G.done&&typeof G.done==="object")?G.done:{}; G.det=(G.det&&typeof G.det==="object")?G.det:{}; G.log=Array.isArray(G.log)?G.log:[]; G.xp=+G.xp||0;
function save(){ store.set("noamV3",G) }
var RANKS=[{x:0,n:"יוצא לדרך",e:"🌱"},{x:30,n:"מתאמן",e:"🛡️"},{x:80,n:"מנוסה",e:"⚡"},{x:150,n:"מנהיג",e:"🧭"},{x:250,n:"אגדה",e:"👑"}];
var COLORS=[{c:"#2a9d8f",x:0},{c:"#6c8ebf",x:0},{c:"#e76f51",x:20},{c:"#9b5de5",x:50},{c:"#f2c14e",x:100},{c:"#1f2937",x:180}];
function rankOf(xp){ var r=0; RANKS.forEach(function(k,i){ if(xp>=k.x) r=i }); return r }

/* ---------- sound (synthesized) ---------- */
var ac=null,muted=false;
function ctx(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return ac }
function tone(f,t0,d,vol,type){
  var a=ctx(); if(!a||muted) return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0,a.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol||.14,a.currentTime+t0+.02);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);
  o.connect(g); g.connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.05);
}
var PENTA=[523,587,659,784,880,1046,1175];
function sTap(){ tone(PENTA[Math.floor(Math.random()*5)],0,.22) }
function sWrong(){ tone(300,0,.28,.07,"triangle") }
function sOk(){ [0,2,4].forEach(function(n,i){tone(PENTA[n],i*.08,.35)}) }
function sWin(){ PENTA.forEach(function(f,i){tone(f,i*.08,.45)}) }

/* ---------- drawing ---------- */
function face(k){
  var eyes='<circle cx="-10" cy="-180" r="3.6" fill="#22324a"/><circle cx="10" cy="-180" r="3.6" fill="#22324a"/>';
  if(k==="uneasy") return eyes+'<path d="M-17 -191 L-5 -187 M17 -191 L5 -187" stroke="#22324a" stroke-width="3" stroke-linecap="round"/><path d="M-8 -166 Q-3 -170 0 -166 Q4 -162 8 -166" fill="none" stroke="#22324a" stroke-width="3" stroke-linecap="round"/>';
  if(k==="angry") return eyes+'<path d="M-18 -190 L-4 -184 M18 -190 L4 -184" stroke="#22324a" stroke-width="3.5" stroke-linecap="round"/><path d="M-9 -162 Q0 -170 9 -162" fill="none" stroke="#22324a" stroke-width="3" stroke-linecap="round"/>';
  if(k==="sad") return eyes+'<path d="M-17 -187 L-5 -191 M17 -187 L5 -191" stroke="#22324a" stroke-width="3" stroke-linecap="round"/><path d="M-9 -162 Q0 -170 9 -162" fill="none" stroke="#22324a" stroke-width="3" stroke-linecap="round"/>';
  if(k==="surprised") return '<circle cx="-10" cy="-180" r="5" fill="#22324a"/><circle cx="10" cy="-180" r="5" fill="#22324a"/><circle cx="0" cy="-164" r="5" fill="none" stroke="#22324a" stroke-width="3"/>';
  if(k==="neutral") return eyes+'<path d="M-8 -166 L8 -166" stroke="#22324a" stroke-width="3" stroke-linecap="round"/>';
  return eyes+'<path d="M-10 -168 Q0 -157 10 -168" fill="none" stroke="#22324a" stroke-width="3" stroke-linecap="round"/>';
}
var bobN=0;
function kid(x,y,o){
  o=o||{}; var s=o.s||1, d=o.dir||1, shirt=o.shirt||"#2a9d8f", skin=o.skin||"#f0c29c", hair=o.hair||"#4a3426", pants=o.pants||"#3d4a66";
  var al=o.l||[-36,-78], ar=o.r||[36,-78];
  function arm(p,sx){ return '<line x1="'+sx+'" y1="-136" x2="'+p[0]+'" y2="'+p[1]+'" stroke="'+shirt+'" stroke-width="15" stroke-linecap="round"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="'+skin+'"/>'; }
  var rot=o.lean?' rotate('+o.lean+')':'';
  bobN++;
  return '<g class="'+(o.still?'':'bob ')+(o.role||'oth')+'" style="animation-delay:-'+((bobN%5)*.5)+'s"><g transform="translate('+x+','+y+') scale('+(d*s)+','+s+')'+rot+'">'+
    '<rect x="-19" y="-72" width="15" height="72" rx="7" fill="'+pants+'"/><rect x="4" y="-72" width="15" height="72" rx="7" fill="'+pants+'"/>'+
    '<ellipse cx="-10" cy="0" rx="16" ry="6" fill="#1f2a3d"/><ellipse cx="12" cy="0" rx="16" ry="6" fill="#1f2a3d"/>'+
    arm(al,-26)+'<rect x="-29" y="-152" width="58" height="88" rx="22" fill="'+shirt+'"/>'+arm(ar,26)+
    '<circle cx="0" cy="-178" r="30" fill="'+skin+'"/>'+
    '<path d="M-30 -182 Q-27 -214 0 -212 Q28 -214 30 -182 Q14 -198 -30 -182Z" fill="'+hair+'"/>'+
    face(o.face)+'</g></g>';
}
function ring(x,y,w){ return '<ellipse cx="'+x+'" cy="'+(y+4)+'" rx="'+(w||52)+'" ry="14" fill="#f2c14e" opacity=".55"/>'; }
function bg(){
  return '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ecf7"/><stop offset="1" stop-color="#f1f8fc"/></linearGradient></defs>'+
    '<rect width="800" height="420" fill="url(#sky)"/><circle cx="700" cy="70" r="34" fill="#fbe7a1"/>'+
    '<rect y="360" width="800" height="60" fill="#bfe3c4"/><rect x="60" y="250" width="14" height="112" fill="#9a7a5a"/><circle cx="67" cy="225" r="58" fill="#8fcf9d"/><circle cx="40" cy="250" r="38" fill="#a4dcb0"/>';
}
function bubble(x,y,w,txt,fs){
  var cx=x+w/2;
  return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="64" rx="22" fill="#fff" stroke="#c9d3df" stroke-width="3"/><polygon points="'+(cx-14)+','+(y+64)+' '+(cx+6)+','+(y+64)+' '+(cx-8)+','+(y+88)+'" fill="#fff" stroke="#c9d3df" stroke-width="3"/><rect x="'+(cx-16)+'" y="'+(y+58)+'" width="24" height="10" fill="#fff"/><text x="'+cx+'" y="'+(y+46)+'" font-size="'+(fs||40)+'" text-anchor="middle">'+txt+'</text></g>';
}
function ME(o){ o=o||{}; o.shirt=G.hero; o.role='me'; return o }

/* ---------- scenes ---------- */
var SC=[
 { id:0, nm:"צוחקים עליי", ic:"😜",
  svg:function(){
    return bg()+ring(320,360,50)+ring(470,360,50)+
      kid(320,360,ME({face:"happy",l:[-34,-80],r:[36,-80]}))+'<text x="372" y="150" font-size="34">💧</text>'+

      if(!an) return;
      an.getByteTimeDomainData(buf); var sum=0; for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v }
      var rms=Math.sqrt(sum/buf.length); if(rms>.05&&rms<.22) peakFrames++; ema=ema*.8+rms*.2; if(ema>maxEma) maxEma=ema;
      var el=$("lvl"); if(el) el.style.width=Math.min(100,Math.round(rms*400))+"%";
      raf=requestAnimationFrame(loop);
    })();
  }).catch(function(){});
}
function stopMeter(){ cancelAnimationFrame(raf); an=null; if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null } var el=$("lvl"); if(el) el.style.width="0" }
var camStream=null, camTimer=0;
function stopCam(){ clearInterval(camTimer); if(camStream){ camStream.getTracks().forEach(function(t){t.stop()}); camStream=null } }
function stopAll(){ try{ if(rec) rec.abort() }catch(e){} listening=false; stopMeter(); stopCam() }

function sayPanel(){
  var sc=P.sc;
  $("zone").innerHTML='<div class="say"><div class="lbl">המשפט שלי · תגיד אותו בקול</div><div class="sent">'+sc.sentence+'</div>'+
    (SR?'<button class="mic" id="mic" aria-label="הקלט">🎤</button><div class="meter"><i id="lvl"></i><u></u></div><div class="mlab">המטרה: להגיע לאזור המסומן. לא צריך לצעוק.</div><div class="heard" id="heard">לחץ על המיקרופון ותגיד. אפשר גם במילים שלך.</div><button class="big" id="said" style="background:#fff;color:#1d776c;border:3px solid #1d776c;box-shadow:none;font-size:20px;padding:10px 22px;margin-top:10px">אמרתי (בלי מיקרופון) ✔</button>'
       :'<button class="big" id="said">אמרתי בקול ✔</button>')+'</div>';
  $("said").onclick=function(){ finish(false) };
  if(SR) $("mic").onclick=listen;
}
function listen(){
  if(listening) return; listening=true; alts=[]; recErr="";
  var mic=$("mic"), heard=$("heard"); mic.classList.add("on"); heard.className="heard"; heard.textContent="מקשיב…"; sTap();
  startMeter();
  try{
    var cur=rec=new SR(); rec.lang="he-IL"; rec.interimResults=true; rec.maxAlternatives=3; rec.continuous=false;
    rec.onresult=function(e){
      if(rec!==cur) return;
      alts=[]; var live="";
      for(var i=0;i<e.results.length;i++){ var r=e.results[i]; for(var j=0;j<r.length;j++) alts.push(r[j].transcript); live+=r[0].transcript+" " }
      heard.textContent="שמעתי: "+live;
    };
    rec.onerror=function(e){ if(rec===cur) recErr=e.error||"error" };
    rec.onend=function(){ if(rec!==cur) return; listening=false; stopMeter(); var m=$("mic"); if(m) m.classList.remove("on"); evaluate() };
    rec.start();
    setTimeout(function(){ if(listening&&rec===cur){ try{ cur.stop() }catch(e){} } },9000);
    setTimeout(function(){ if(listening&&rec===cur){ listening=false; stopMeter(); var m=$("mic"); if(m) m.classList.remove("on"); evaluate() } },11000);
  }catch(e){ listening=false; stopMeter(); mic.classList.remove("on"); recErr="start"; evaluate() }
}
function evaluate(){
  if(!P||P.done) return;
  var heard=$("heard"); if(!heard) return;
  if(/not-allowed|service-not-allowed|network|audio-capture|language-not-supported|start/.test(recErr)){
    heard.textContent="המיקרופון לא זמין כרגע. אפשר ללחוץ ״אמרתי בלי מיקרופון״."; heard.className="heard"; return;
  }
  if(!alts.length){ heard.textContent="לא שמעתי. אפשר לנסות שוב, או ללחוץ ״אמרתי״."; return }
  P.tries++;
  var best=0; alts.forEach(function(a){ best=Math.max(best,score(a,P.sc)) });
  if(best>=.45&&meterOn&&maxEma<MINVOL){ var pc=Math.round(maxEma*400); heard.className="heard"; heard.textContent="שמעתי אותך. עוד קצת יותר חזק, כמו שמדברים עם מישהו שעומד לידך. (למורה: עוצמה "+pc+"%)"; return }
  if(best>=.45){ heard.className="heard ok"; P.voice=meterOn?maxEma>=MINVOL:false; heard.textContent="✔ שמעתי: "+alts[0]+(P.voice?" · קול ברור ותקיף 👍":" · אפשר גם קצת יותר בקול, אם בא לך"); sOk(); var sq=P.seq; setTimeout(function(){ if(P&&P.seq===sq) finish(true) },900) }
  else { heard.textContent="שמעתי: "+alts[0]+". ייתכן שהמערכת לא הבינה. אפשר שוב, או ללחוץ ״אמרתי״."; }
}

/* ---------- reward: the sentence card is the reward; repetition upgrades it ---------- */
function finish(heardOk){
  if(!P||P.done) return; P.done=true; stopAll();
  var id=P.sc.id; G.done[id]=(G.done[id]||0)+1; var n=Math.min(3,G.done[id]);
  var xp=(G.done[id]||0)===1?10:3, oldRank=rankOf(G.xp), oldXp=G.xp; G.xp+=xp; Q.earned+=xp;
  var h=heardOk&&alts[0]?String(alts[0]).replace(/[<>&]/g,""):"";
  G.log.push({id:id,t:Date.now(),h:h,w:P.wrong}); G.log=G.log.slice(-40);
  save();
  var newRank=rankOf(G.xp), unl=COLORS.filter(function(k){ return k.x>oldXp&&k.x<=G.xp }).length;
  sWin(); burst(n===3?24:12);
  var last=(Q.i>=Q.ids.length-1), kind=n==3?"gold":n==2?"rare":"", kn=n==3?"קלף מצטיין · תרגלת "+G.done[id]+" פעמים":n==2?"קלף נדיר · תרגלת פעמיים":"קלף כוח חדש";
  $("zone").innerHTML='<div class="reward"><div class="rcard '+kind+'"><div class="rk">'+kn+'</div><div class="ri">'+P.sc.ic+'</div><div class="rs">'+P.sc.sentence+'</div></div>'+
    '<div class="gain">+'+xp+' נקודות · תרגול חוזר משדרג את הקלף</div>'+
    (P.sc.note?'<div class="unl" style="color:#1d776c">'+P.sc.note+'</div>':'')+
    (newRank>oldRank?'<div class="unl">עלית לדרגה: '+RANKS[newRank].e+' '+RANKS[newRank].n+'!</div>':'')+
    (unl?'<div class="unl">נפתח צבע חדש בארון! 👕</div>':'')+
    '<button class="big" id="nx">'+(last?(Q.chal?"סיכום":"חזרה לבית"):"הלאה")+'</button></div>';
  var chip=$("chip"); if(chip) chip.outerHTML=chipHtml();
  $("nx").onclick=function(){
    sTap();
    if(!last){ Q.i++; scene() } else if(Q.chal){ summary() } else home();
  };
}
function summary(){
  $("app").innerHTML=topbar('<button class="tbtn" id="bHome">‹ בית</button>')+'<div class="reward" style="padding:30px 0"><div style="font-size:100px">🏆</div><h1>סיימת את האתגר!</h1><div class="gain">הרווחת '+Q.earned+' נקודות</div><div class="cta" style="justify-content:center"><button class="big gold" id="again">⚡ עוד אתגר</button><button class="big" id="hm">לבית</button></div></div>';
  bindTop(); burst(40); sWin();
  $("bHome").onclick=home; $("hm").onclick=home;
  $("again").onclick=function(){ play(randIds(),true) };
}

document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ var m=document.querySelector(".modal"); if(m) m.remove() } });
document.addEventListener("pointerdown",function(){ ctx() },{once:true});

/* start (hash #N or #Nsay = open scene N, for testing) */
var m=(location.hash||"").match(/^#(\d)(say)?$/);
if(m&&SC[+m[1]]){ play([+m[1]],false); if(m[2]) sayPanel() } else home();
document.documentElement.setAttribute("data-ok","1");
})();
</script>
</body>
